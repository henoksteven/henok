<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Konoha Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #f97316;
            --accent-hover: #ea580c;
            --accent-light: rgba(249, 115, 22, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Login Modal */
        .login-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 36px;
            border-radius: 16px;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .login-box h2 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .login-box input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 16px;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        .login-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-box button:hover {
            background: var(--accent-hover);
        }

        /* Admin Dashboard */
        .dashboard {
            display: none;
        }

        .header {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 24px 28px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 700;
        }

        .header .admin-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header .admin-info span {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: var(--bg-main);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .logout-btn:hover {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fecaca;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px 24px;
            border-radius: 16px;
        }

        .stat-card h3 {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-card .number {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 700;
        }

        .users-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 28px;
            border-radius: 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            color: var(--text-primary);
            font-size: 15px;
            font-weight: 600;
        }

        .refresh-btn {
            padding: 8px 14px;
            background: var(--accent-light);
            color: var(--accent);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        .refresh-btn:hover {
            background: rgba(249, 115, 22, 0.2);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: var(--bg-main);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            color: var(--text-primary);
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-block;
            text-transform: capitalize;
        }

        .status.pending { background: #fef3c7; color: #d97706; }
        .status.approved { background: #dcfce7; color: #15803d; }
        .status.rejected { background: #fee2e2; color: #dc2626; }

        .traffic-info {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .traffic-info span {
            font-weight: 500;
            color: var(--text-primary);
        }

        .actions {
            display: flex;
            gap: 6px;
        }

        .action-btn {
            padding: 6px 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .approve-btn { color: #15803d; }
        .approve-btn:hover { background: #dcfce7; border-color: #bbf7d0; }

        .reject-btn { color: #dc2626; }
        .reject-btn:hover { background: #fee2e2; border-color: #fecaca; }

        .delete-btn { color: var(--text-secondary); }
        .delete-btn:hover { background: var(--bg-main); color: var(--text-primary); }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            font-size: 13px;
            font-weight: 500;
        }
        .message.success { background: #dcfce7; color: #15803d; }
        .message.error { background: #fee2e2; color: #dc2626; }

        .loading, .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Login Modal -->
    <div class="login-modal" id="loginModal">
        <div class="login-box">
            <h2>Admin Login</h2>
            <form id="loginForm">
                <input type="password" id="adminPassword" placeholder="Masukkan password admin" required>
                <button type="submit">Akses Panel</button>
            </form>
            <div class="message" id="loginMessage"></div>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="container dashboard" id="dashboard">
        <div class="header">
            <h1>Hotspot Control Panel</h1>
            <div class="admin-info">
                <span id="adminName">Admin Konoha</span>
                <button class="logout-btn" onclick="logout()">Keluar</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Pending</h3>
                <div class="number" id="pendingUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Approved</h3>
                <div class="number" id="approvedUsers">0</div>
            </div>
            <div class="stat-card">
                <h3>Rejected</h3>
                <div class="number" id="rejectedUsers">0</div>
            </div>
        </div>

        <div class="users-section">
            <div class="section-header">
                <h2>Daftar Pengguna Hotspot</h2>
                <button class="refresh-btn" onclick="loadUsers()">Refresh Data</button>
            </div>

            <div class="message" id="message"></div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Nama</th>
                            <th>Email</th>
                            <th>Username</th>
                            <th>Status</th>
                            <th>Penggunaan Traffic</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Data akan dimuat otomatis lewat API -->
                    </tbody>
                </table>
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <p>Belum ada user terdaftar di database Upstash Redis.</p>
            </div>

            <div class="loading" id="loading" style="display: block;">
                Memuat data dari database...
            </div>
        </div>
    </div>

    <script>
        // BACKEND_URL disesuaikan secara dinamis mengikuti domain aktif Vercel
        const BACKEND_URL = window.location.origin.includes('vercel.app') 
            ? window.location.origin 
            : 'https://henok-lake.vercel.app';

        if (localStorage.getItem('adminLoggedIn') === 'true') {
            showDashboard();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('adminPassword').value;

            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('adminLoggedIn', 'true');
                    showDashboard();
                } else {
                    showLoginMessage('Password admin salah!', 'error');
                }
            } catch (error) {
                showLoginMessage('Gagal terhubung ke server', 'error');
            }
        });

        function showLoginMessage(text, type) {
            const message = document.getElementById('loginMessage');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            setTimeout(() => { message.style.display = 'none'; }, 3000);
        }

        function showDashboard() {
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadUsers();
        }

        function logout() {
            localStorage.removeItem('adminLoggedIn');
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        async function loadUsers() {
            const tbody = document.getElementById('usersTableBody');
            const loading = document.getElementById('loading');
            const emptyState = document.getElementById('emptyState');

            loading.style.display = 'block';
            tbody.innerHTML = '';

            try {
                const response = await fetch(`${BACKEND_URL}/api/users`);
                const data = await response.json();

                loading.style.display = 'none';

                if (data.success && data.users.length > 0) {
                    emptyState.style.display = 'none';
                    
                    let total = data.users.length;
                    let pending = 0;
                    let approved = 0;
                    let rejected = 0;

                    data.users.forEach(user => {
                        if (user.status === 'pending') pending++;
                        if (user.status === 'approved') approved++;
                        if (user.status === 'rejected') rejected++;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${user.name || '-'}</td>
                            <td>${user.email || '-'}</td>
                            <td><b>${user.username}</b></td>
                            <td><span class="status ${user.status}">${user.status}</span></td>
                            <td>
                                <div class="traffic-info">
                                    ⏱️ Uptime: <span>${user.uptime || 'Off'}</span><br>
                                    ⬇️ DL: <span>${formatBytes(user.bytesIn)}</span> | ⬆️ UL: <span>${formatBytes(user.bytesOut)}</span>
                                </div>
                            </td>
                            <td>
                                <div class="actions">
                                    <button class="action-btn approve-btn" onclick="updateStatus('${user.username}', 'approve')" ${user.status === 'approved' ? 'disabled' : ''}>Approve</button>
                                    <button class="action-btn reject-btn" onclick="updateStatus('${user.username}', 'reject')" ${user.status === 'rejected' ? 'disabled' : ''}>Reject</button>
                                    <button class="action-btn delete-btn" onclick="deleteUser('${user.username}')">Delete</button>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });

                    document.getElementById('totalUsers').textContent = total;
                    document.getElementById('pendingUsers').textContent = pending;
                    document.getElementById('approvedUsers').textContent = approved;
                    document.getElementById('rejectedUsers').textContent = rejected;

                } else {
                    emptyState.style.display = 'block';
                }
            } catch (error) {
                loading.style.display = 'none';
                showMessage('Gagal memuat data dari Upstash Redis', 'error');
            }
        }

        async function updateStatus(username, action) {
            const endpoint = action === 'approve' ? '/api/approve' : '/api/reject';
            try {
                const response = await fetch(`${BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, adminName: 'Admin' })
                });
                const data = await response.json();
                if (data.success) {
                    showMessage(`Berhasil ${action} user ${username}`, 'success');
                    loadUsers();
                } else {
                    showMessage(data.message || 'Gagal mengubah status', 'error');
                }
            } catch (error) {
                showMessage('Terjadi kesalahan koneksi', 'error');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Hapus user ${username}?`)) return;
            try {
                const response = await fetch(`${BACKEND_URL}/api/users/${username}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    showMessage(`User ${username} berhasil dihapus`, 'success');
                    loadUsers();
                } else {
                    showMessage('Gagal menghapus user', 'error');
                }
            } catch (error) {
                showMessage('Terjadi kesalahan koneksi', 'error');
            }
        }

        formatBytes = function(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        };

        function showMessage(text, type) {
            const message = document.getElementById('message');
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
            setTimeout(() => { message.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
