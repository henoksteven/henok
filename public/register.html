<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun - Jaringan Hotspot</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
            position: relative;
            overflow-x: hidden;
        }

        /* Efek cahaya latar belakang artistik */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(99, 102, 241, 0.25);
            filter: blur(80px);
            border-radius: 50%;
            top: -50px;
            left: -50px;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(168, 85, 247, 0.2);
            filter: blur(80px);
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            z-index: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header { 
            text-align: center; 
            margin-bottom: 28px; 
        }
        
        .header h1 { 
            color: #ffffff; 
            font-size: 24px; 
            font-weight: 800; 
            letter-spacing: -0.5px;
            margin-bottom: 8px; 
        }
        
        .header p { 
            color: #94a3b8; 
            font-size: 13px; 
            font-weight: 500;
        }

        .form-group { 
            margin-bottom: 16px; 
        }
        
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            color: #cbd5e1; 
            font-weight: 600; 
            font-size: 12px; 
            letter-spacing: 0.3px;
        }
        
        .form-group input {
            width: 100%; 
            padding: 12px 16px; 
            background: rgba(15, 23, 42, 0.6); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; 
            font-size: 14px; 
            color: #ffffff; 
            outline: none; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .form-group input::placeholder { 
            color: #64748b; 
        }
        
        .form-group input:focus { 
            border-color: #818cf8; 
            box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.15); 
            background: rgba(15, 23, 42, 0.9);
        }

        .btn {
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            font-size: 14px; 
            font-weight: 700; 
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }
        
        .btn:hover { 
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            transform: translateY(-1px);
            box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.5);
        }
        
        .btn:active { 
            transform: scale(0.98); 
        }
        
        .btn:disabled { 
            background: #334155; 
            color: #94a3b8; 
            cursor: not-allowed; 
            box-shadow: none;
        }

        .message { 
            padding: 12px 16px; 
            border-radius: 12px; 
            margin-top: 16px; 
            display: none; 
            font-size: 13px; 
            text-align: center; 
            font-weight: 600; 
            animation: fadeIn 0.3s ease;
        }
        
        .message.success { 
            background: rgba(22, 163, 74, 0.15); 
            color: #4ade80; 
            border: 1px solid rgba(74, 222, 128, 0.3); 
        }
        
        .message.error { 
            background: rgba(220, 38, 38, 0.15); 
            color: #f87171; 
            border: 1px solid rgba(248, 113, 113, 0.3); 
        }

        .login-link { 
            text-align: center; 
            margin-top: 24px; 
            color: #94a3b8; 
            font-size: 13px; 
        }
        
        .login-link a { 
            color: #818cf8; 
            text-decoration: none; 
            font-weight: 700; 
            transition: color 0.2s;
        }
        
        .login-link a:hover { 
            color: #a5b4fc;
            text-decoration: underline; 
        }

        .loading {
            display: inline-block; 
            width: 16px; 
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3); 
            border-radius: 50%; 
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite; 
            margin-right: 8px; 
            vertical-align: middle;
        }
        
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Buat Akun Baru</h1>
            <p>Dapatkan akses instan ke jaringan hotspot kami</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" required placeholder="Contoh: John Doe">
            </div>

            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" required placeholder="nama@email.com">
            </div>

            <div class="form-group">
                <label for="phone">Nomor Telepon / WhatsApp</label>
                <input type="tel" id="phone" required placeholder="08xxxxxxxxxx">
            </div>

            <div class="form-group">
                <label for="username">Username Hotspot</label>
                <input type="text" id="username" required placeholder="Pilih username unik">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Minimal 6 karakter">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" required placeholder="Ulangi password">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Daftar Sekarang</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Masuk di sini</a>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://henok-lake.vercel.app';

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Konfirmasi password tidak cocok!', 'error');
                return;
            }

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                username: document.getElementById('username').value,
                password: password
            };

            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Memproses...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    showMessage('Registrasi berhasil! Menunggu persetujuan admin...', 'success');
                    form.reset();
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    showMessage(data.message || 'Gagal mendaftar.', 'error');
                }
            } catch (error) {
                showMessage('Terjadi kesalahan koneksi ke server.', 'error');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Daftar Sekarang';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
